[package]
name = "noltri-companion"
version = "0.1.4"
description = "知序 Noltri 本地知识库"
authors = ["知序 Noltri"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "noltri_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }

[features]
# `cargo tauri dev` runs with --no-default-features so the frontend is served by vite;
# `cargo tauri build` re-enables custom-protocol so ../dist is embedded.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
