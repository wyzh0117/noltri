[package]
name = "noltri-companion"
version = "0.1.0"
description = "知序 Noltri 本地知识库"
authors = ["知序 Noltri"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "noltri_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "=2.13.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSBitmapImageRep", "NSImageRep", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSObject", "NSString", "NSThread"] }

[features]
# `cargo tauri dev` runs with --no-default-features so the frontend is served by vite;
# `cargo tauri build` re-enables custom-protocol so ../dist is embedded.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
native-capture-acceptance = []

[dev-dependencies]
# Already locked transitively by the updater; constructs genuine signature errors in tests.
minisign-verify = "=0.3.0"
